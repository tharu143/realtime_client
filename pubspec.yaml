name: realtime_client
description: A production-ready Flutter/Dart realtime client library with robust connection management, persistence, ordered delivery, typing indicators, presence, and read receipts.
version: 0.1.0
homepage: https://github.com/tharu143/realtime_client
repository: https://github.com/tharu143/realtime_client
issue_tracker: https://github.com/tharu143/realtime_client/issues
documentation: https://github.com/tharu143/realtime_client#readme

topics:
  - websocket
  - socket-io
  - realtime
  - chat
  - messaging

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Networking & Sockets
  web_socket_channel: ^2.4.0
  socket_io_client: ^2.0.3
  http: ^1.1.0
  
  # Persistence
  sqflite: ^2.3.0
  path: ^1.8.3
  flutter_secure_storage: ^9.0.0
  
  # Utilities
  uuid: ^4.2.1
  connectivity_plus: ^5.0.2
  logger: ^2.0.2
  rxdart: ^0.27.7
  equatable: ^2.0.5
  
  # JSON
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  mockito: ^5.4.2
  lints: ^2.1.1
  test: ^1.24.3
  sqflite_common_ffi: ^2.3.5
